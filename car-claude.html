.sheet{position:fixed;right:12px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:60;width:min(330px,calc(100vw - 24px));box-sizing:border-box;overflow:auto;background:rgba(6,12,26,.88);backdrop-filter:blur(10px);border:1px solid rgba(60,170,255,.35);border-radius:14px;padding:10px 12px;font-size:12px;display:none}.sheet.open{display:block}.sheet summary{display:none}.sheet h3{margin:0 0 6px;font-size:13px}.sheet ul{padding-left:16px;margin:4px 0 8px}.sheet li{margin:4px 0;line-height:1.55}.dock{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:61;display:flex;gap:6px}.dock button{padding:9px 12px;font-size:13px;font-weight:700;background:rgba(6,12,26,.92)}.dock button[aria-expanded=true]{background:#15356a;border-color:#7cd0ff}

</style></head><body>

let P={...DEF};const CARS=[['random','🎲 隨機輪播'],['sedan','圓潤四門轎跑'],['coupe','流線雙門跑車'],['hatch','圓潤小型掀背'],['suv','圓潤休旅'],['spyder','🏎️ 敮篷超跑'],['toy','🧸 玩具超跑（小朋友款）'],['cart','🐂 阿公的牛車']],GASN=[['gold','🟡 金色'],['blue','🔵 霓虹藍'],['white','⚪ 純白'],['orange','🟠 火焰橘'],['purple','🟣 魅影紫'],['green','🟢 螢光綠'],['car','🎨 跟隨車色'],['pink','🌸 粉紅色'],['tiffany','💎 Tiffany 綠'],['rainbow','🌈 彩虹']];

const SL=[['probVTOL','直升機機率 %',0,100,1],['probSpin','3D 空翻機率 %',0,100,1],['probArc','拋物線機率 %',0,100,1],['probRamp','隱形坡道機率 %',0,100,1],['rampRolls','坡道側翻圈數',0,4,1],['hangTime','倒掛停留時間 s',0,6,.1],['landTime','緩慢降落耗時 s',1,8,.1],['arcHeight','飛躍最大高度 px',50,300,1],['flightDuration','飛行總耗時 s',1,8,.1],['spinCount','空中旋轉圈數',0,5,1],['patrolSpeedMin','巡航速度下限 x',.2,10,.1],['patrolSpeedMax','巡航速度上限 x',.2,10,.1],['smokeDensity','噴霧氣體密度',1,20,1],['textPassOpacity','穿越標題透明度',.2,1,.05]];

sync();

const help=document.getElementById('help');
help.innerHTML='<h3>📖 使用說明</h3><ul><li><b>這是什麼</b>：浪人包膜的 3D 特技展演，車子在霓虹軌道上巡航，並隨機表演特技。</li><li><b>特技模式</b>：直升機＝垂直升降；3D 空翻＝空中翻轉（可調圈數）；拋物線＝弧形飛越；隱形坡道＝沿隱形坡道爬升到車頂朝下倒掛半空、飛出後側翻再緩降。選「隨機自動輪播」會依三個機率自動表演。</li><li><b>機率滑桿</b>：只在隨機模式有效，各特技機率會自動換算成比例。隱形坡道可另調「倒掛停留時間」「緩慢降落耗時」「坡道側翻圈數」。</li><li><b>🚀 手動表演特技</b>：馬上表演一次。<b>⏸️ 暫停/繼續</b>：凍結或恢復所有動畫。</li><li><b>車款</b>：轎跑、跑車、掀背、休旅、敮篷超跑、玩具超跑，還有阿公的牛車。</li><li><b>膜色</b>：每次特技後自動換色，也可按「🎨 隨機換色」手動換；可取消「自動改色」。</li><li><b>噴霧色板</b>：選氣體顏色，可跟隨車色或彩虹；密度越高氣體越濃。</li><li><b>氣體物理</b>：噴嘴固定在車身，推力＝重力＋加速度。上升強噴、緩降輕噴（仍向下），翻轉時噴向隨車身轉動，前後另有姿態噴嘴。</li><li><b>📋 複製 JSON</b>：匯出目前設定。<b>🔄 恢復預設值</b>：全部還原。</li><li><b>面板</b>：兩個按鈕固定在右下角，點一下展開、再點收起，同時只開一個，並且不會擋到車子的軌道。</li></ul>';

// ===== Three.js 場景 =====
const T=THREE, clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)), sm=t=>{t=clamp(t);return t*t*(3-2*t)};

}

const cname=document.getElementById('cname'),wFrom=new T.Color(),wTo=new T.Color();let wi=0,wT=1,wF=[.35,.22,1],wTT=[.35,.22,1];
document.getElementById('wrapColor').innerHTML='<option value="random">🎲 隨機換色</option>'+WRAPS.map((w,i)=>`<option value="${i}">${w[0]}</option>`).join('');sync();
function recolor(k){
  let n=k;if(n==null)do{n=Math.floor(Math.random()*WRAPS.length)}while(n===wi);wi=n;const w=WRAPS[n];
  wFrom.copy(pearl.color);wTo.setHex(w[1]);wF=[pearl.metalness,pearl.roughness,pearl.clearcoat];wTT=[w[2],w[3],w[4]];wT=0;cname.textContent=w[0];

}

(function(){
  return;const s=new T.Shape();s.moveTo(-39,-8);s.lineTo(-39.5,0);s.quadraticCurveTo(-37,4,-26,5);

// ===== 車款（圓潤造型 + 透明擋風玻璃、車門、門把、車牌、車燈）=====

const pcv=document.createElement('canvas');pcv.width=256;pcv.height=128;
(c=>{c.fillStyle='#f4f4f0';c.fillRect(0,0,256,128);c.fillStyle='#1a3a8a';c.fillRect(0,0,256,30);c.fillStyle='#fff';c.font='bold 22px sans-serif';c.textAlign='center';c.fillText('浪人包膜',128,23);c.fillStyle='#111';c.font='bold 40px sans-serif';c.fillText('RONIN 888',128,95)})(pcv.getContext('2d'));

const MODELS={
 sedan:{low:[[-39.5,-6],[-39.7,-1],[-36,3.5],[-26,5.2],[-8,5.8],[12,5.6],[28,4.2],[37,1.2],[39.6,-3],[39.2,-7]],gh:[[-27,5.8],[-12.5,13.6],[5,14.4],[19.5,6]],B:2,doors:[-16,2,20],seats:[-6,8],wx:[-25,25],wr:7.2},

};

    const L=Math.hypot(ex,ey)||1;ex/=L;ey/=L;const[px,py]=tw(lx,ly);

      emit(wx+px+(Math.random()-.5)*5,wy+py+(Math.random()-.5)*3,ex*s+(Math.random()-.5)*70+car.vx*.4,ey*s+(Math.random()-.5)*70+car.vy*.4,gasCol(),.55+I*.7+Math.random()*.4)}
  };
  if(m){
    const Fx=k.ax,Fy=Math.max(0,G+k.ay),mag=Math.hypot(Fx,Fy)||1,Dx2=-Fx/mag,Dy2=-Fy/mag,thrust=mag; // 所需推力 T = m(g + a_y)；緩降時 T 變小但仍向下噴
    let I=clamp(thrust/(1.6*G));if(m!=='Ramp'){if(u<.1)I*=1+(1-u/.1)*.8;else if(u>.92)I*=1.3}I=clamp(I)*(k.thr==null?1:k.thr);
    let mw=0;for(const[lx,ly,nx,ny,sc]of[[-22,-12,0,-1,.6],[22,-12,0,-1,.6],[-36,0,-1,0,1],[36,0,1,0,.7],[-10,14,0,1,.6],[10,14,0,1,.6]]){const[ex,ey]=tw(nx,ny),l=Math.hypot(ex,ey)||1,wt=Math.pow(Math.max(0,(ex*Dx2+ey*Dy2)/l),3);mw=Math.max(mw,wt);if(wt>.04)jet(lx,ly,ex,ey,I*wt*sc)}if(mw<.35)jet(0,-12,Dx2,Dy2,I*.5);
    if(m!=='VTOL'&&m!=='Ramp'&&u<.12){const[bx,by]=tw(-1,0);jet(-36,0,bx,by,.9*(1-u/.12))} // 起跳後噴
    if((m==='Spin'||m==='Ramp')&&k.thr!==0&&Math.abs(k.alpha)>1.2){ // 姿態控制噴嘴 (RCS)：前後成對產生力矩
      const I2=clamp(Math.abs(k.alpha)/7),sg=Math.sign(k.alpha);
      for(const s of[30,-30]){const[rx,ry]=tw(s,0),l=Math.hypot(rx,ry)||1;jet(s,0,sg*ry/l,-sg*rx/l,I2*.9)}
    }
    if(P.trailGlow){let n=dt*55;n=Math.floor(n)+(Math.random()<n%1?1:0);for(;n>0;n--)emit(wx+(Math.random()-.5)*50,wy+(Math.random()-.5)*14,(Math.random()-.5)*30,(Math.random()-.5)*30,gasCol(),.5)}
  }else if(Math.abs(k.axA)>40){ // 巡航加速／煞車
    const I=clamp(Math.abs(k.axA)/250);
    if(k.axA>0){const[bx,by]=tw(-1,0);jet(-36,0,bx,by,I)}else{const[fx,fy]=tw(1,0);jet(36,0,fx,fy,I)}
  }
}
let last=performance.now();
function frame(now){
  const raw=Math.min(.05,(now-last)/1000);last=now;const dt=paused?0:raw;
  const k=stepCar(dt);emitAll(dt,k);updP(dt);
  car.face+=(car.dir-car.face)*Math.min(1,raw*9);if(Math.abs(car.face)<.06)car.face=.06*car.dir; // 轉向時車身翻面
  pivot.position.set(car.x,railY+16+car.h,0);pivot.rotation.z=car.pitch;inner.rotation.x=car.roll;inner.rotation.y=-.3*car.face*Math.cos(car.roll);inner.scale.x=car.face;
  under.intensity=P.trailGlow?2.2:.8;
  const sy=innerHeight-(railY+16+car.h);car.op+=((Math.abs(sy-titleMid)<70?P.textPassOpacity:1)-car.op)*Math.min(1,raw*10);
  if(wT<1){wT=Math.min(1,wT+raw/.9);const q=sm(wT);pearl.color.copy(wFrom).lerp(wTo,q);pearl.metalness=wF[0]+(wTT[0]-wF[0])*q;pearl.roughness=wF[1]+(wTT[1]-wF[1])*q;pearl.clearcoat=wF[2]+(wTT[2]-wF[2])*q}
  mats.forEach(x=>x.opacity=car.op);glassM.opacity=.4*car.op;
  renderer.render(scene,cam);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
