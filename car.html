<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>浪人包膜 頭份店 - 特斯拉特技展示</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #080c14;
      background-image: radial-gradient(ellipse at top, #0f172a 0%, #080c14 60%, #000000 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: block;
      padding: 16px 16px 80px 16px;
      overflow-x: hidden;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
    }

    header {
      text-align: center;
      margin-top: 12px;
      margin-bottom: 12px;
      position: relative;
      z-index: 10;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 9999px;
      background: rgba(8, 47, 73, 0.8);
      border: 1px solid rgba(14, 165, 233, 0.3);
      color: #38bdf8;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .title-text {
      font-size: 28px;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .title-highlight {
      background: linear-gradient(to right, #38bdf8, #5eead4, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle-text {
      color: #94a3b8;
      font-size: 13px;
      max-width: 500px;
      margin: 0 auto;
    }

    main {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      position: relative;
      z-index: 20;
      padding: 0;
    }

    .stage-card {
      position: relative;
      width: 100%;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(30, 41, 59, 0.8);
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.5);
      overflow: visible;
    }

    .rail-track {
      position: absolute;
      top: 35px;
      left: -20px;
      right: -20px;
      height: 2px;
      background: linear-gradient(to right, transparent, #38bdf8, #ec4899, #38bdf8, transparent);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.8);
      z-index: 15;
    }

    #petContainer {
      position: absolute;
      top: 18px;
      left: 0;
      width: 65px;
      height: 32px;
      pointer-events: none;
      z-index: 50;
      will-change: transform;
      transform-style: preserve-3d;
    }

    .thruster-particle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 45;
      animation: particle-fade 0.5s linear forwards;
    }

    @keyframes particle-fade {
      0% { opacity: 0.9; transform: scale(1); }
      100% { opacity: 0; transform: scale(2.5) translateY(14px); }
    }

    footer {
      max-width: 900px;
      width: 100%;
      margin: 20px auto 0 auto;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(30, 41, 59, 0.9);
      padding: 16px;
      border-radius: 20px;
      font-size: 12px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn-action {
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-trigger {
      background: linear-gradient(to right, #06b6d4, #2563eb);
      color: #030712;
    }

    .btn-pause {
      background: #eab308;
      color: #0f172a;
    }

    .btn-reset {
      background: #334155;
      color: #f1f5f9;
    }

    .btn-json {
      background: #1e293b;
      color: #f472b6;
      border: 1px solid rgba(244, 114, 182, 0.3);
    }

    .slider-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    .slider-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      color: #cbd5e1;
    }

    .slider-value {
      color: #38bdf8;
      font-family: monospace;
    }

    .prob-panel {
      grid-column: 1 / -1;
      background: rgba(30, 41, 59, 0.4);
      border: 1px dashed rgba(56, 189, 248, 0.3);
      border-radius: 12px;
      padding: 10px;
      margin-top: 4px;
    }

    .prob-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-top: 6px;
    }

    select, input[type="range"] {
      width: 100%;
      height: 28px;
      border-radius: 6px;
      accent-color: #38bdf8;
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 0 6px;
    }

    .tesla-midair-glow {
      filter: drop-shadow(0 0 15px #ffffff) drop-shadow(0 0 30px #38bdf8) !important;
    }
  </style>
</head>
<body>

  <header id="headerSection">
    <div class="badge">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: #38bdf8;"></span>
      浪人包膜 頭份店 - 專屬特技動態展演
    </div>
    <h1 class="title-text">
      浪人包膜 <span class="title-highlight">頭份店</span> 特技展示
    </h1>
    <p class="subtitle-text">
      珍珠白特斯拉自動進行巡航與三種特技模式（直升機20%/3D空翻40%/拋物線40%）全自動表演。
    </p>
  </header>

  <main>
    <div id="stageContainer" class="stage-card">
      <div class="rail-track"></div>

      <!-- 白色特斯拉動態圖形 -->
      <div id="petContainer">
        <svg id="teslaSvg" viewBox="0 0 120 60" style="width:100%; height:100%; filter: drop-shadow(0 4px 12px rgba(255, 255, 255, 0.8)); transition: filter 0.3s ease;">
          <g transform="translate(10, 10)">
            <ellipse cx="50" cy="36" rx="40" ry="4" fill="#ffffff" opacity="0.7"/>
            <!-- 珍珠白車身 -->
            <path d="M 5 28 Q 12 18 28 14 Q 50 6 75 14 Q 88 20 95 28 L 98 32 Q 95 36 88 36 L 10 36 Q 5 36 5 28 Z" fill="url(#whiteTeslaGradient)" stroke="#ffffff" stroke-width="1.5"/>
            <!-- 車窗玻璃 -->
            <path d="M 26 15 Q 45 8 68 14 L 78 24 L 20 24 Z" fill="#0f172a" opacity="0.9" stroke="#38bdf8" stroke-width="1"/>
            <!-- 白光頭燈與紅尾燈 -->
            <ellipse cx="93" cy="27" rx="4" ry="2" fill="#ffffff" filter="drop-shadow(0 0 8px #ffffff)"/>
            <ellipse cx="7" cy="27" rx="3" ry="2" fill="#ef4444" filter="drop-shadow(0 0 8px #ef4444)"/>
            <!-- 車輪 -->
            <circle cx="78" cy="34" r="7" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
            <circle cx="78" cy="34" r="3" fill="#ffffff"/>
            <circle cx="22" cy="34" r="7" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>
            <circle cx="22" cy="34" r="3" fill="#ffffff"/>
          </g>
          <defs>
            <linearGradient id="whiteTeslaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="60%" stop-color="#f1f5f9"/>
              <stop offset="100%" stop-color="#cbd5e1"/>
            </linearGradient>
          </defs>
        </svg>
      </div>

    </div>
  </main>

  <footer>
    <div class="panel-header">
      <div style="font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 6px;">
        <span>🎛️ 特斯拉展演調參面板</span>
      </div>
      <div style="display: flex; gap: 6px; flex-wrap: wrap;">
        <button id="pauseAnimBtn" class="btn-action btn-pause">⏸️ 暫停動畫</button>
        <button id="manualTriggerBtn" class="btn-action btn-trigger">🚀 手動表演特技</button>
        <button id="resetDefaultsBtn" class="btn-action btn-reset">🔄 恢復預設值</button>
        <button id="exportJsonBtn" class="btn-action btn-json">📋 複製 JSON 設定檔</button>
      </div>
    </div>

    <div class="slider-grid">
      <div class="slider-item">
        <div class="slider-label">
          <span>🚁 飛行特技模式</span>
        </div>
        <select id="param_stuntMode">
          <option value="random" selected>🎲 隨機自動輪播 (Auto Random)</option>
          <option value="vtol">直升機垂直升降 (VTOL)</option>
          <option value="spin">3D 旋轉空翻 (3D Spin Roll)</option>
          <option value="arc">拋物線弧形 (Parabolic Arc)</option>
        </select>
      </div>

      <!-- 隨機輪播機率設定區塊 -->
      <div class="prob-panel" id="probPanel">
        <div style="color: #38bdf8; font-weight: 600; font-size: 11px;">🎲 隨機模式三種特技機率分配 (合計: <span id="val_probTotal" style="color:#a855f7;">100%</span>)</div>
        <div class="prob-grid">
          <div class="slider-item">
            <div class="slider-label">
              <span>🚁 直升機垂直升降</span>
              <span id="val_probVTOL" class="slider-value">20%</span>
            </div>
            <input type="range" id="param_probVTOL" min="0" max="100" step="5" value="20">
          </div>
          <div class="slider-item">
            <div class="slider-label">
              <span>🌀 3D 旋轉空翻</span>
              <span id="val_probSpin" class="slider-value">40%</span>
            </div>
            <input type="range" id="param_probSpin" min="0" max="100" step="5" value="40">
          </div>
          <div class="slider-item">
            <div class="slider-label">
              <span>🚀 拋物線弧形</span>
              <span id="val_probArc" class="slider-value">40%</span>
            </div>
            <input type="range" id="param_probArc" min="0" max="100" step="5" value="40">
          </div>
        </div>
      </div>

      <div class="slider-item">
        <div class="slider-label">
          <span>🚀 飛躍/升空最大高度</span>
          <span id="val_arcHeight" class="slider-value">140px</span>
        </div>
        <input type="range" id="param_arcHeight" min="50" max="300" step="5" value="140">
      </div>

      <div class="slider-item">
        <div class="slider-label">
          <span>⏱️ 飛行總耗時</span>
          <span id="val_flightDuration" class="slider-value">4.7s</span>
        </div>
        <input type="range" id="param_flightDuration" min="1.0" max="8.0" step="0.1" value="4.7">
      </div>

      <div class="slider-item">
        <div class="slider-label">
          <span>🌀 空中旋轉圈數</span>
          <span id="val_spinCount" class="slider-value">3 圈</span>
        </div>
        <input type="range" id="param_spinCount" min="0" max="5" step="1" value="3">
      </div>

      <div class="slider-item">
        <div class="slider-label">
          <span>🏎️ 平面巡航速度 (隨機範圍)</span>
          <span id="val_patrolSpeed" class="slider-value">1.8 - 2.4x</span>
        </div>
        <div style="display: flex; gap: 6px; align-items: center;">
          <input type="range" id="param_patrolSpeedMin" min="0.2" max="3.0" step="0.1" value="1.8">
          <span style="color:#64748b;">~</span>
          <input type="range" id="param_patrolSpeedMax" min="0.2" max="4.0" step="0.1" value="2.4">
        </div>
      </div>

      <div class="slider-item">
        <div class="slider-label">
          <span>💨 噴霧氣體密度</span>
          <span id="val_smokeDensity" class="slider-value">6</span>
        </div>
        <input type="range" id="param_smokeDensity" min="0" max="10" step="1" value="6">
      </div>

      <div class="slider-item" style="flex-direction: row; align-items: center; justify-content: space-between; margin-top: 6px;">
        <span style="color: #cbd5e1;">✨ 殘影/霓虹光暈 (Trail Glow)</span>
        <input type="checkbox" id="param_trailGlow" checked style="width: 18px; height: 18px; accent-color: #38bdf8;">
      </div>
    </div>
  </footer>

  <script>
    const DEFAULT_CONFIG = {
      stuntMode: 'random',
      probVTOL: 20,
      probSpin: 40,
      probArc: 40,
      arcHeight: 140,
      flightDuration: 4.7,
      spinCount: 3,
      patrolSpeedMin: 1.8,
      patrolSpeedMax: 2.4,
      smokeDensity: 6,
      trailGlow: true,
      textPassOpacity: 0.85
    };

    let config = { ...DEFAULT_CONFIG };

    const petContainer = document.getElementById('petContainer');
    const stageContainer = document.getElementById('stageContainer');
    const pauseAnimBtn = document.getElementById('pauseAnimBtn');

    let isHopping = false;
    let isPaused = false;
    let currentX = 0;
    let currentY = 0;
    let currentPatrolSpeed = 2.0;
    let idleAnimFrame = null;
    let idleTargetX = 0;
    let autoStuntTimer = null;

    function initPosition() {
      const stageRect = stageContainer.getBoundingClientRect();
      currentX = stageRect.width / 2 - 30;
      currentY = 0;
      petContainer.style.transform = `translate3d(${currentX}px, ${currentY}px, 0px)`;
      startIdlePatrol();
      resetAutoStuntTimer();
    }

    function getRandomPatrolSpeed() {
      const min = Math.min(config.patrolSpeedMin, config.patrolSpeedMax);
      const max = Math.max(config.patrolSpeedMin, config.patrolSpeedMax);
      return Math.random() * (max - min) + min;
    }

    function startIdlePatrol() {
      if (idleAnimFrame) cancelAnimationFrame(idleAnimFrame);
      pickNewIdleTarget();

      function patrolStep() {
        if (!isHopping && !isPaused) {
          const dx = idleTargetX - currentX;
          if (Math.abs(dx) < 3) {
            pickNewIdleTarget();
          } else {
            const stepSpeed = (Math.sign(dx) * currentPatrolSpeed * 1.2);
            currentX += stepSpeed;
            const faceScaleX = Math.sign(dx) < 0 ? -1 : 1;
            petContainer.style.transform = `translate3d(${currentX}px, ${currentY}px, 0px) scaleX(${faceScaleX})`;
          }
        }
        idleAnimFrame = requestAnimationFrame(patrolStep);
      }
      idleAnimFrame = requestAnimationFrame(patrolStep);
    }

    function pickNewIdleTarget() {
      const stageRect = stageContainer.getBoundingClientRect();
      const minX = -40;
      const maxX = stageRect.width + 10;
      idleTargetX = Math.random() * (maxX - minX) + minX;
      currentPatrolSpeed = getRandomPatrolSpeed();
    }

    function resetAutoStuntTimer() {
      if (autoStuntTimer) clearTimeout(autoStuntTimer);
      if (isPaused) return;

      const nextDelay = Math.random() * 4000 + 3000;
      autoStuntTimer = setTimeout(() => {
        if (!isPaused) triggerFlight();
        resetAutoStuntTimer();
      }, nextDelay);
    }

    function selectModeByProbability() {
      const v = config.probVTOL;
      const s = config.probSpin;
      const a = config.probArc;
      const total = v + s + a;
      if (total === 0) return 'arc';

      const rand = Math.random() * total;
      if (rand < v) return 'vtol';
      if (rand < v + s) return 'spin';
      return 'arc';
    }

    function triggerFlight() {
      if (isHopping || isPaused) return;
      isHopping = true;

      const stageRect = stageContainer.getBoundingClientRect();
      const startX = currentX;
      const startY = currentY;
      const endX = Math.random() * (stageRect.width + 60) - 30;

      const activeMode = config.stuntMode === 'random' 
        ? selectModeByProbability()
        : config.stuntMode;

      const startTime = performance.now();
      const duration = config.flightDuration * 1000;
      const maxSpin = config.spinCount * 360;

      if (config.trailGlow) {
        petContainer.classList.add('tesla-midair-glow');
      }

      function animate(now) {
        if (isPaused) {
          requestAnimationFrame(animate);
          return;
        }

        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);

        let x = startX;
        let y = startY;
        let rotation = 0;
        let opacity = 1;

        if (activeMode === 'vtol') {
          if (progress < 0.3) {
            const sub = progress / 0.3;
            x = startX;
            y = startY - (sub * config.arcHeight);
          } else if (progress < 0.7) {
            const sub = (progress - 0.3) / 0.4;
            x = startX + (endX - startX) * sub;
            y = startY - config.arcHeight;
            opacity = config.textPassOpacity;
          } else {
            const sub = (progress - 0.7) / 0.3;
            x = endX;
            y = (startY - config.arcHeight) + (sub * config.arcHeight);
          }
        } else {
          x = startX + (endX - startX) * progress;
          const arcY = Math.sin(progress * Math.PI) * config.arcHeight;
          y = startY - arcY;
          rotation = (activeMode === 'spin') ? progress * maxSpin : 0;
          opacity = 1 - (Math.sin(progress * Math.PI) * (1 - config.textPassOpacity));
        }

        const tiltPerspective = Math.sin(progress * Math.PI * 2) * 15;
        petContainer.style.transform = `translate3d(${x}px, ${y}px, 0px) rotate(${rotation}deg) rotateX(${tiltPerspective}deg)`;
        petContainer.style.opacity = opacity;

        if (config.smokeDensity > 0 && Math.random() < (config.smokeDensity / 10)) {
          createSmokeParticle(x + 24, y + 36);
        }

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          currentX = endX;
          currentY = startY;
          isHopping = false;
          petContainer.classList.remove('tesla-midair-glow');
          petContainer.style.opacity = 1;
          petContainer.style.transform = `translate3d(${currentX}px, ${currentY}px, 0px) scaleX(1)`;
          pickNewIdleTarget();
        }
      }

      requestAnimationFrame(animate);
    }

    function createSmokeParticle(x, y) {
      if (isPaused) return;
      const p = document.createElement('div');
      p.className = 'thruster-particle';
      const size = Math.random() * 8 + 4;
      p.style.width = `${size}px`;
      p.style.height = `${size}px`;
      p.style.left = `${x}px`;
      p.style.top = `${y}px`;
      p.style.background = `rgba(255, 255, 255, 0.9)`;
      p.style.boxShadow = `0 0 6px #ffffff`;
      stageContainer.appendChild(p);
      setTimeout(() => p.remove(), 500);
    }

    function updateProbUI() {
      document.getElementById('val_probVTOL').innerText = `${config.probVTOL}%`;
      document.getElementById('val_probSpin').innerText = `${config.probSpin}%`;
      document.getElementById('val_probArc').innerText = `${config.probArc}%`;
      const total = config.probVTOL + config.probSpin + config.probArc;
      const totalEl = document.getElementById('val_probTotal');
      totalEl.innerText = `${total}%`;
      totalEl.style.color = total === 100 ? '#38bdf8' : '#f43f5e';
    }

    function updateSpeedUI() {
      const min = Math.min(config.patrolSpeedMin, config.patrolSpeedMax);
      const max = Math.max(config.patrolSpeedMin, config.patrolSpeedMax);
      document.getElementById('val_patrolSpeed').innerText = `${min.toFixed(1)} - ${max.toFixed(1)}x`;
    }

    document.getElementById('param_stuntMode').addEventListener('change', (e) => {
      config.stuntMode = e.target.value;
      document.getElementById('probPanel').style.display = config.stuntMode === 'random' ? 'block' : 'none';
    });

    document.getElementById('param_probVTOL').addEventListener('input', (e) => {
      config.probVTOL = parseInt(e.target.value);
      updateProbUI();
    });

    document.getElementById('param_probSpin').addEventListener('input', (e) => {
      config.probSpin = parseInt(e.target.value);
      updateProbUI();
    });

    document.getElementById('param_probArc').addEventListener('input', (e) => {
      config.probArc = parseInt(e.target.value);
      updateProbUI();
    });

    document.getElementById('param_arcHeight').addEventListener('input', (e) => {
      config.arcHeight = parseFloat(e.target.value);
      document.getElementById('val_arcHeight').innerText = `${config.arcHeight}px`;
    });

    document.getElementById('param_flightDuration').addEventListener('input', (e) => {
      config.flightDuration = parseFloat(e.target.value);
      document.getElementById('val_flightDuration').innerText = `${config.flightDuration}s`;
    });

    document.getElementById('param_spinCount').addEventListener('input', (e) => {
      config.spinCount = parseInt(e.target.value);
      document.getElementById('val_spinCount').innerText = `${config.spinCount} 圈`;
    });

    document.getElementById('param_patrolSpeedMin').addEventListener('input', (e) => {
      config.patrolSpeedMin = parseFloat(e.target.value);
      updateSpeedUI();
    });

    document.getElementById('param_patrolSpeedMax').addEventListener('input', (e) => {
      config.patrolSpeedMax = parseFloat(e.target.value);
      updateSpeedUI();
    });

    document.getElementById('param_smokeDensity').addEventListener('input', (e) => {
      config.smokeDensity = parseInt(e.target.value);
      document.getElementById('val_smokeDensity').innerText = config.smokeDensity;
    });

    document.getElementById('param_trailGlow').addEventListener('change', (e) => {
      config.trailGlow = e.target.checked;
    });

    pauseAnimBtn.addEventListener('click', () => {
      isPaused = !isPaused;
      if (isPaused) {
        pauseAnimBtn.innerText = '▶️ 繼續動畫';
        pauseAnimBtn.style.background = '#22c55e';
        if (autoStuntTimer) clearTimeout(autoStuntTimer);
      } else {
        pauseAnimBtn.innerText = '⏸️ 暫停動畫';
        pauseAnimBtn.style.background = '#eab308';
        resetAutoStuntTimer();
      }
    });

    document.getElementById('manualTriggerBtn').addEventListener('click', triggerFlight);

    document.getElementById('resetDefaultsBtn').addEventListener('click', () => {
      config = { ...DEFAULT_CONFIG };
      document.getElementById('param_stuntMode').value = config.stuntMode;
      document.getElementById('probPanel').style.display = 'block';
      document.getElementById('param_probVTOL').value = config.probVTOL;
      document.getElementById('param_probSpin').value = config.probSpin;
      document.getElementById('param_probArc').value = config.probArc;
      updateProbUI();

      document.getElementById('param_arcHeight').value = config.arcHeight;
      document.getElementById('val_arcHeight').innerText = `${config.arcHeight}px`;

      document.getElementById('param_flightDuration').value = config.flightDuration;
      document.getElementById('val_flightDuration').innerText = `${config.flightDuration}s`;

      document.getElementById('param_spinCount').value = config.spinCount;
      document.getElementById('val_spinCount').innerText = `${config.spinCount} 圈`;

      document.getElementById('param_patrolSpeedMin').value = config.patrolSpeedMin;
      document.getElementById('param_patrolSpeedMax').value = config.patrolSpeedMax;
      updateSpeedUI();

      document.getElementById('param_smokeDensity').value = config.smokeDensity;
      document.getElementById('val_smokeDensity').innerText = config.smokeDensity;

      document.getElementById('param_trailGlow').checked = config.trailGlow;

      if (isPaused) {
        isPaused = false;
        pauseAnimBtn.innerText = '⏸️ 暫停動畫';
        pauseAnimBtn.style.background = '#eab308';
      }
      resetAutoStuntTimer();
    });

    document.getElementById('exportJsonBtn').addEventListener('click', () => {
      const jsonStr = JSON.stringify(config, null, 2);
      const tempInput = document.createElement('textarea');
      tempInput.value = jsonStr;
      document.body.appendChild(tempInput);
      tempInput.select();
      document.execCommand('copy');
      document.body.removeChild(tempInput);
      alert('已複製 JSON 參數設定檔！');
    });

    window.addEventListener('load', () => {
      setTimeout(initPosition, 200);
    });
    window.addEventListener('resize', initPosition);
  </script>
</body>
</html>
