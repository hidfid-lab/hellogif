<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多段影片串接 ‧ 文字特效影片產生器</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
body{background:#121212;color:#e8e6e1;font-family:'Noto Sans TC',sans-serif}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#444;border-radius:3px}
.card{background:#171717;border:1px solid #262626;border-radius:16px;padding:14px}
.h{font-size:12px;color:#fbbf24;letter-spacing:.12em;font-weight:600;margin-bottom:8px}
.chip{padding:8px 12px;border-radius:10px;background:#262626;border:1px solid #404040;font-size:13px;color:#d4d4d4}
.chip.on{border-color:#f59e0b;color:#fbbf24}
select,textarea{width:100%;padding:8px;background:#262626;border:1px solid #404040;border-radius:10px;color:#eee;font-size:13px}
input[type=range]{width:100%;accent-color:#f59e0b}
label.l{display:flex;justify-content:space-between;font-size:11px;color:#a3a3a3;margin-bottom:4px}
.clipi{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;border-radius:12px;background:#262626;border:1px solid #404040;font-size:13px;cursor:pointer}
.clipi.on{border-color:#f59e0b}.clipi button{padding:2px 8px;background:#404040;border-radius:8px}
</style>
</head>
<body>
<div class="h-screen flex flex-col lg:flex-row">

<section class="shrink-0 lg:w-1/2 h-[46vh] lg:h-full flex flex-col items-center p-3 lg:p-5 bg-neutral-950 border-b lg:border-b-0 lg:border-r border-neutral-800">
  <div class="flex-1 min-h-0 w-full flex items-center justify-center">
    <canvas id="cv" class="rounded-xl border border-neutral-800 shadow-2xl" style="max-width:100%;max-height:100%"></canvas>
  </div>
  <div class="w-full max-w-[560px] mt-2 flex flex-wrap items-center justify-center gap-2">
    <button id="bPlay" class="chip">▶ 預覽全部</button>
    <button id="bStop" class="chip">■ 停止</button>
    <button data-a="9:16" class="asp chip on">9:16 直式</button>
    <button data-a="16:9" class="asp chip">16:9 橫式</button>
    <select id="qSel" style="width:auto"><option value="540" selected>畫質：標準</option><option value="720">畫質：高</option></select>
    <span id="tm" class="text-xs text-neutral-400"></span>
  </div>
  <button id="bMake" class="mt-2 w-full max-w-[560px] py-2.5 rounded-full bg-amber-500 text-neutral-950 font-bold">🎬 生成影片</button>
  <p id="stat" class="text-xs text-neutral-400 mt-1 text-center">錄製需要和影片一樣長的時間，過程中請停留在此頁面。</p>
</section>

<section class="flex-1 min-h-0 overflow-y-auto p-3 lg:p-5 space-y-3">
  <div class="card">
    <p class="text-sm text-amber-200 bg-amber-500/10 rounded-lg p-2 mb-3">① 加入影片或照片　② 點選一個片段，設定文字和特效　③ 按「預覽全部」　④ 按「生成影片」</p>
    <div class="flex items-center justify-between mb-2"><div class="h !mb-0">片段清單（<span id="totalT">0</span> 秒）</div>
      <div class="flex gap-2">
        <label class="chip cursor-pointer">＋影片<input type="file" id="fVid" accept="video/*" multiple class="hidden"></label>
        <label class="chip cursor-pointer">＋照片<input type="file" id="fImg" accept="image/*" multiple class="hidden"></label>
      </div></div>
    <div id="list" class="space-y-2"></div>
  </div>

  <div id="editor" class="card space-y-3 hidden">
    <div class="h">編輯選取的片段</div>
    <div id="vidBox" class="space-y-3">
      <div><label class="l"><span>影片從第幾秒開始</span><span id="vStart"></span></label><input type="range" id="eStart" min="0" max="10" step="0.5"></div>
      <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="eKeep" class="accent-amber-500"> 保留這段影片的原聲</label>
    </div>
    <div><label class="l"><span>這一段的長度</span><span id="vDur"></span></label><input type="range" id="eDur" min="1" max="20" step="0.5"></div>
    <div><label class="l"><span>文字內容</span></label><textarea id="eText" rows="2"></textarea></div>
    <div class="grid grid-cols-2 gap-3">
      <div><label class="l"><span>字體</span></label><select id="eFont">
        <option value="'Noto Serif TC', serif">宋體 / 明體</option><option value="'Noto Sans TC', sans-serif">黑體</option><option value="'Cinzel', serif">Cinzel</option></select></div>
      <div><label class="l"><span>文字顏色</span></label><input type="color" id="eColor" class="w-full h-9 bg-transparent"></div>
      <div><label class="l"><span>字級</span><span id="vSize"></span></label><input type="range" id="eSize" min="16" max="120"></div>
      <div><label class="l"><span>文字上下位置</span><span id="vY"></span></label><input type="range" id="eY" min="5" max="95"></div>
      <div><label class="l"><span>文字動畫</span></label><select id="eTa"><option value="fade">淡入</option><option value="rise">上浮淡入</option><option value="pop">彈出放大</option><option value="type">逐字打出</option><option value="none">無</option></select></div>
      <div><label class="l"><span>背景變暗</span><span id="vDim"></span></label><input type="range" id="eDim" min="0" max="70"></div>
    </div>
    <div><label class="l"><span>畫面特效</span></label><select id="eFx">
      <option value="none">無</option><option value="snow">❄️ 雪花飄落</option><option value="petal">🌸 花瓣飄落</option><option value="dust">✨ 金色光點上升</option><option value="star">⭐ 星光閃爍</option>
      <option value="tornado">🌪️ 龍捲風來襲</option><option value="tsunami">🌊 海嘯淹沒</option><option value="meteor">☄️ 隕石雨轟炸</option><option value="lightning">⚡ 雷雨閃電</option><option value="fire">🔥 熊熊大火</option><option value="ufo">🛸 UFO 綁架牛</option></select></div>
    <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="eQuake" class="accent-amber-500"> 🫨 地震搖晃</label>
  </div>

  <div class="card space-y-3">
    <div class="h">🎵 背景音樂（選填，整支影片共用）</div>
    <label class="chip block text-center cursor-pointer">選擇音樂檔<input type="file" id="mFile" accept="audio/*" class="hidden"></label>
    <p id="mInfo" class="text-xs text-neutral-400">尚未選擇音樂</p>
    <div><label class="l"><span>從音樂的第幾秒開始</span><span id="vMs">0:00</span></label><input type="range" id="mStart" min="0" max="0" step="0.5" value="0"></div>
    <div><label class="l"><span>音樂音量</span><span id="vMv">70%</span></label><input type="range" id="mVol" min="10" max="100" value="70"></div>
  </div>
  <p class="text-xs text-neutral-500 px-1 pb-6">提醒：生成是即時錄製，片子多長就要等多久。建議整支控制在 1 分鐘內，檔案才不會太大。iPhone 拍的 HEVC 影片在部分瀏覽器可能無法讀取。</p>
</section>
</div>

<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),T2=2*Math.PI;
let W=540,H=960,asp='9:16',Q=540,clips=[],sel=-1,playing=false,raf=0,T0=0,curIdx=-1,exp=false,uid=0,mFile=null,mBuf=null,mAud=null;
const PT=(()=>{let q=7;const r=()=>(q=(q*16807)%2147483647)/2147483647;return Array.from({length:70},()=>({x:r(),y:r(),r:r(),c:1+Math.floor(r()*2),ph:r()*6.28}))})();
const fmt=x=>Math.floor(x/60)+':'+String(Math.floor(x%60)).padStart(2,'0');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const total=()=>clips.reduce((a,c)=>a+c.dur,0);

function setSize(){W=asp==='9:16'?Q:Math.round(Q*16/9);H=asp==='9:16'?Math.round(Q*16/9):Q;cv.width=W;cv.height=H;redraw()}

// ---------- 素材載入 ----------
function newVid(url){const v=document.createElement('video');v.muted=true;v.playsInline=true;v.setAttribute('playsinline','');v.preload='auto';v.src=url;return v}
function loadMedia(c){return new Promise(res=>{
  if(c.type==='image'){const im=new Image();im.onload=()=>{c.el=im;res(true)};im.onerror=()=>res(false);im.src=c.url}
  else{const v=newVid(c.url);v.onloadedmetadata=()=>{c.vdur=v.duration||0;c.el=v;res(c.vdur>0)};v.onerror=()=>res(false)}})}
async function addFiles(type,files){
  for(const f of files){
    const c={id:++uid,type,url:URL.createObjectURL(f),name:f.name,el:null,vdur:0,start:0,dur:3,text:'在這裡輸入文字',size:56,color:'#ffffff',y:50,font:"'Noto Serif TC', serif",ta:'fade',fx:'none',dim:20,keep:true,quake:false};
    $('stat').textContent='讀取中：'+f.name;
    if(!(await loadMedia(c))){alert('無法讀取：'+f.name+'（格式可能不支援）');continue}
    if(type==='video')c.dur=Math.max(.5,Math.round(Math.min(c.vdur,5)*2)/2);
    clips.push(c);sel=clips.length-1}
  $('stat').textContent='';renderList();syncEditor();setMusicRange();redraw()}

// ---------- 清單 ----------
function renderList(){
  $('list').innerHTML=clips.length?clips.map((c,i)=>`<div class="clipi ${i===sel?'on':''}" onclick="pick(${i})"><span class="truncate">${i+1}. ${c.type==='video'?'🎬':'🖼️'} ${esc(c.name)} ‧ ${c.dur}秒</span><span class="flex gap-1 shrink-0"><button onclick="event.stopPropagation();mv(${i},-1)">↑</button><button onclick="event.stopPropagation();mv(${i},1)">↓</button><button onclick="event.stopPropagation();del(${i})">✕</button></span></div>`).join(''):'<p class="text-xs text-neutral-500">還沒有片段，請按右上角「＋影片」或「＋照片」。</p>';
  $('editor').classList.toggle('hidden',sel<0);$('totalT').textContent=total()}
function pick(i){stop();sel=i;renderList();syncEditor();redraw()}
function mv(i,d){const j=i+d;if(j<0||j>=clips.length)return;[clips[i],clips[j]]=[clips[j],clips[i]];sel=j;renderList();redraw()}
function del(i){stop();clips.splice(i,1);sel=Math.min(sel,clips.length-1);renderList();syncEditor();setMusicRange();redraw()}

// ---------- 編輯面板 ----------
function labels(c){$('vDur').textContent=c.dur+' 秒';$('vStart').textContent=c.start+' 秒';$('vSize').textContent=c.size;$('vY').textContent=c.y+'%';$('vDim').textContent=c.dim+'%'}
function syncEditor(){const c=clips[sel];if(!c)return;
  $('vidBox').classList.toggle('hidden',c.type!=='video');
  if(c.type==='video'){$('eStart').max=Math.max(0,c.vdur-.5);$('eStart').value=c.start;$('eKeep').checked=c.keep;$('eDur').max=Math.max(.5,Math.min(20,c.vdur-c.start))}
  else $('eDur').max=20;
  $('eDur').value=c.dur;$('eText').value=c.text;$('eFont').value=c.font;$('eColor').value=c.color;$('eSize').value=c.size;$('eY').value=c.y;
  $('eTa').value=c.ta;$('eDim').value=c.dim;$('eFx').value=c.fx;$('eQuake').checked=c.quake;labels(c)}
function bind(id,prop,conv,after){$(id).addEventListener('input',e=>{const c=clips[sel];if(!c)return;
  c[prop]=conv(e.target.type==='checkbox'?e.target.checked:e.target.value);if(after)after(c);labels(c);renderList();setMusicRange();redraw()})}
const num=v=>+v,id=v=>v;
bind('eDur','dur',num);
bind('eStart','start',num,c=>{c.dur=Math.min(c.dur,Math.max(.5,c.vdur-c.start));$('eDur').max=Math.max(.5,Math.min(20,c.vdur-c.start));$('eDur').value=c.dur});
bind('eKeep','keep',id);bind('eText','text',id);bind('eFont','font',id);bind('eColor','color',id);bind('eSize','size',num);bind('eY','y',num);
bind('eTa','ta',id);bind('eDim','dim',num);bind('eFx','fx',id);bind('eQuake','quake',id);

// ---------- 特效 ----------
const EM=(e,x,y,z,r)=>{ctx.save();ctx.translate(x,y);if(r)ctx.rotate(r);ctx.font=`${z}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='transparent';ctx.fillText(e,0,0);ctx.restore()};
function particleFx(s,k){const n={snow:70,petal:28,dust:50,star:30}[k],tp=s/8,kk=Math.min(W,H)/540;ctx.save();
  for(let i=0;i<n;i++){const p=PT[i];
    if(k==='star'){const a=(Math.sin(T2*s/1.6+p.ph)+1)/2,x=p.x*W,y=p.y*H,z=(3+p.r*10*a)*kk;ctx.globalAlpha=a;ctx.fillStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=8;
      ctx.beginPath();ctx.moveTo(x,y-z);ctx.lineTo(x+z*.25,y-z*.25);ctx.lineTo(x+z,y);ctx.lineTo(x+z*.25,y+z*.25);ctx.lineTo(x,y+z);ctx.lineTo(x-z*.25,y+z*.25);ctx.lineTo(x-z,y);ctx.lineTo(x-z*.25,y-z*.25);ctx.closePath();ctx.fill();continue}
    const sn=Math.sin(T2*tp+p.ph),f=(p.y+tp*(.6+.8*p.r))%1,y=f*H,x=((p.x+(k==='petal'?.06:k==='dust'?.02:.03)*sn+1)%1)*W;
    if(k==='snow'){ctx.globalAlpha=.55+.4*p.r;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,(1.5+p.r*4.5)*kk,0,7);ctx.fill()}
    else if(k==='petal'){ctx.save();ctx.translate(x,y);ctx.rotate(T2*s/2+p.ph);ctx.globalAlpha=.85;ctx.fillStyle=p.r>.5?'#ffb7c5':'#ffd6e0';ctx.beginPath();ctx.ellipse(0,0,(6+p.r*8)*kk,(3+p.r*3)*kk,0,0,7);ctx.fill();ctx.restore()}
    else{ctx.globalAlpha=.35+.55*(sn+1)/2;ctx.fillStyle='#ffe096';ctx.shadowColor='#f5b942';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(x,H-y,(1.5+p.r*3)*kk,0,7);ctx.fill()}}
  ctx.restore()}
function disasterFx(t,k){const S=Math.min(W,H),kk=S/540;ctx.save();ctx.shadowColor='transparent';
  if(k==='tornado'){ctx.fillStyle=`rgba(25,25,35,${.3*Math.sin(Math.PI*t)})`;ctx.fillRect(0,0,W,H);
    const cx=-S*.3+t*(W+S*.6),fy=f=>H*.2+f*H*.68,fw=f=>S*.2*(1-f)+S*.025,fs=f=>Math.sin(T2*(t*3+f*1.5))*S*.04*(1-f*.5);
    for(let i=0;i<40;i++){const f=i/40;ctx.fillStyle=i%2?'rgba(70,70,82,.62)':'rgba(105,105,118,.62)';ctx.beginPath();ctx.ellipse(cx+fs(f),fy(f),fw(f),fw(f)*.2,0,0,7);ctx.fill()}
    for(let j=0;j<18;j++){const p=PT[j],f=.1+p.r*.8,a=T2*t*3*p.c+p.ph*3,rw=fw(f)*1.25;ctx.save();ctx.translate(cx+fs(f)+Math.cos(a)*rw,fy(f)+Math.sin(a)*rw*.2);ctx.rotate(a*2);ctx.fillStyle='#3a3a3a';ctx.fillRect(-4,-3,8,6);ctx.restore()}
    [['🐄',0],['🚗',1],['🏠',2]].forEach(([e,m])=>{const f=.2+m*.25,a=T2*(t*2+m/3),rw=fw(f)*1.3;EM(e,cx+fs(f)+Math.cos(a)*rw,fy(f)+Math.sin(a)*rw*.2-10,46*kk,Math.sin(a*2)*.6)})}
  else if(k==='tsunami'){const lv=Math.sin(Math.PI*t),top=H*(1-.85*lv),cy=x=>top+Math.sin(x*.02+T2*t*3)*16*kk+Math.sin(x*.047-T2*t*2)*9*kk;
    if(lv>.001){const g=ctx.createLinearGradient(0,top,0,H);g.addColorStop(0,'rgba(60,170,210,.8)');g.addColorStop(1,'rgba(8,50,110,.9)');
      ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=10)ctx.lineTo(x,cy(x));ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle=g;ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=5*kk;ctx.beginPath();for(let x=0;x<=W;x+=10)x?ctx.lineTo(x,cy(x)):ctx.moveTo(x,cy(x));ctx.stroke();
      const sx=W*(.15+.7*t);EM('🏄',sx,cy(sx)-26*kk,64*kk);
      if(lv>.35)for(let j=0;j<3;j++){const fx=((j*.37+t)%1)*W,fyy=top+(H-top)*(.25+.2*j)+Math.sin(T2*t*2+j)*10;if(fyy<H)EM('🐟',fx,fyy,40*kk)}}}
  else if(k==='meteor'){ctx.fillStyle='rgba(30,10,10,.2)';ctx.fillRect(0,0,W,H);
    for(let j=0;j<6;j++){const p=PT[j+40],tt=(t+j/6)%1,sx=W*(.5+.55*p.x),sy=-60,ex=W*p.y*.8,ey=H*(.6+.3*p.r),dx=ex-sx,dy=ey-sy,x=sx+dx*tt/.9,y=sy+dy*tt/.9;
      if(tt<.9){const g=ctx.createLinearGradient(x,y,x-dx*.18,y-dy*.18);g.addColorStop(0,'rgba(255,200,80,.95)');g.addColorStop(1,'rgba(255,80,0,0)');
        ctx.strokeStyle=g;ctx.lineWidth=9*kk;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-dx*.18,y-dy*.18);ctx.stroke();ctx.fillStyle='#fff3b0';ctx.beginPath();ctx.arc(x,y,9*kk,0,7);ctx.fill()}
      else{const q=(tt-.9)/.1,r=(20+q*90)*kk;ctx.globalAlpha=1-q;ctx.fillStyle='#ffaa28';ctx.beginPath();ctx.arc(ex,ey,r,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,ey,r*.5,0,7);ctx.fill();EM('💥',ex,ey,(60+q*60)*kk);ctx.globalAlpha=1}}}
  else if(k==='lightning'){ctx.fillStyle='rgba(10,12,35,.4)';ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(190,215,255,.4)';ctx.lineWidth=2;ctx.beginPath();
    for(let i=0;i<80;i++){const p=PT[i%70],y=((p.y+t*3)%1)*H,x=((p.x+(i>69?.37:0)-(y/H)*.05+1)%1)*W;ctx.moveTo(x,y);ctx.lineTo(x-4,y+22*kk)}ctx.stroke();
    [.2,.5,.8].forEach((c,m)=>{const d=t-c;if(d<0||d>.07)return;const a=1-d/.07;ctx.fillStyle=`rgba(255,255,255,${.55*a})`;ctx.fillRect(0,0,W,H);
      ctx.strokeStyle=`rgba(255,255,240,${a})`;ctx.lineWidth=5*kk;ctx.shadowColor='#99ccff';ctx.shadowBlur=18;ctx.beginPath();let x=W*(.25+.25*m+PT[m].x*.2),y=0;ctx.moveTo(x,y);
      for(let q=0;q<14;q++){x+=(PT[m*14+q].x-.5)*W*.12;y+=H*.07;ctx.lineTo(x,y)}ctx.stroke();ctx.shadowBlur=0})}
  else if(k==='fire'){ctx.fillStyle='rgba(120,20,0,.16)';ctx.fillRect(0,0,W,H);
    for(let l=0;l<3;l++)for(let i=0;i<36;i++){const p=PT[i],fl=1+.35*Math.sin(T2*(t*(2+l)+p.ph)),hh=H*(.1+.14*p.r)*(1-l*.28)*fl,w=W/36*1.5;
      ctx.fillStyle=['rgba(220,40,10,.8)','rgba(255,140,20,.85)','rgba(255,230,120,.9)'][l];ctx.beginPath();ctx.ellipse((i+.5)/36*W,H-hh*.45,w*(1-l*.2),hh,0,0,7);ctx.fill()}
    ctx.fillStyle='#ffd070';for(let i=0;i<30;i++){const p=PT[i+20],f=(p.y+t*p.c)%1;ctx.globalAlpha=1-f;ctx.beginPath();ctx.arc(((p.x+Math.sin(T2*t*p.c+p.ph)*.03+1)%1)*W,H*(.9-f*.6),(2+p.r*2.5)*kk,0,7);ctx.fill()}ctx.globalAlpha=1}
  else if(k==='ufo'){const ux=W*(.5+.3*Math.sin(T2*t)),uy=H*.14+Math.sin(T2*t*2)*12,g=ctx.createLinearGradient(0,uy,0,H*.9);
    g.addColorStop(0,'rgba(190,255,200,.5)');g.addColorStop(1,'rgba(190,255,200,.08)');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(ux-S*.04,uy+30*kk);ctx.lineTo(ux+S*.04,uy+30*kk);ctx.lineTo(ux+S*.18,H*.9);ctx.lineTo(ux-S*.18,H*.9);ctx.closePath();ctx.fill();
    const f=(t*2)%1;EM('🐄',ux+Math.sin(T2*t*6)*10,H*.88-f*(H*.88-uy-40*kk),50*kk,Math.sin(T2*t*4)*.5);EM('🛸',ux,uy,110*kk)}
  ctx.restore()}

// ---------- 繪製 ----------
function drawText(c,local){const txt=c.text;if(!txt.trim())return;const k=Math.min(W,H)/540;let fs=c.size*k;
  ctx.save();ctx.font=`600 ${fs}px ${c.font}`;const lines=txt.split('\n'),mw=Math.max(...lines.map(l=>ctx.measureText(l).width));
  if(mw>W*.9){fs*=W*.9/mw;ctx.font=`600 ${fs}px ${c.font}`}
  const lh=fs*1.35,cy=H*c.y/100,y0=cy-lines.length*lh/2+lh/2,p=Math.min(1,local/.9),e=1-Math.pow(1-p,3);
  ctx.fillStyle=c.color;ctx.textBaseline='middle';ctx.shadowColor='rgba(0,0,0,.65)';ctx.shadowBlur=10*k;ctx.shadowOffsetY=3*k;
  let dy=0,al=1,sc=1,vis=1;
  if(c.ta==='fade')al=e;else if(c.ta==='rise'){al=e;dy=(1-e)*40*k}else if(c.ta==='pop'){al=e;sc=.6+.4*e}else if(c.ta==='type')vis=Math.min(1,local/(.4+.12*txt.length));
  ctx.globalAlpha=al;ctx.translate(W/2,cy+dy);ctx.scale(sc,sc);ctx.translate(-W/2,-cy);
  let shown=Math.floor(txt.replace(/\n/g,'').length*vis);
  lines.forEach((l,i)=>{let s=l;if(c.ta==='type'){const n=Math.min(l.length,shown);shown-=n;s=l.slice(0,n)}const w=ctx.measureText(l).width;ctx.textAlign='left';ctx.fillText(s,W/2-w/2,y0+i*lh)});
  ctx.restore()}
function drawClip(c,local,i){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.save();
  if(c.quake){ctx.translate(W/2+Math.sin(local*38)*10,H/2+Math.cos(local*43)*10);ctx.scale(1.05,1.05);ctx.translate(-W/2,-H/2)}
  const el=c.el,ew=el&&(el.videoWidth||el.naturalWidth),eh=el&&(el.videoHeight||el.naturalHeight);
  if(ew&&eh){const s=Math.max(W/ew,H/eh),dw=ew*s,dh=eh*s;try{ctx.drawImage(el,(W-dw)/2,(H-dh)/2,dw,dh)}catch(e){}}
  if(c.dim>0){ctx.fillStyle=`rgba(0,0,0,${c.dim/100})`;ctx.fillRect(0,0,W,H)}
  const cyc=Math.min(4,c.dur);
  if(['snow','petal','dust','star'].includes(c.fx))particleFx(local,c.fx);else if(c.fx!=='none')disasterFx((local%cyc)/cyc,c.fx);
  drawText(c,local);ctx.restore();
  const n=clips.length,fi=i>0&&local<.35?1-local/.35:0,fo=i<n-1&&local>c.dur-.35?(local-(c.dur-.35))/.35:0,a=Math.max(fi,fo);
  if(a>0){ctx.fillStyle=`rgba(0,0,0,${a})`;ctx.fillRect(0,0,W,H)}}
function redraw(){if(playing||exp)return;const c=clips[sel];
  if(!c){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#171717';ctx.fillRect(0,0,W,H);ctx.fillStyle='#777';ctx.font=`${W*.045}px sans-serif`;ctx.textAlign='center';ctx.fillText('請先加入影片或照片',W/2,H/2);return}
  if(c.type==='video'&&c.el){if(Math.abs(c.el.currentTime-c.start)>.08){c.el.onseeked=()=>{c.el.onseeked=null;redraw()};c.el.currentTime=c.start;return}}
  drawClip(c,Math.min(c.dur*.6,2.5),sel)}

// ---------- 播放引擎 ----------
function enter(i){curIdx=i;clips.forEach((c,j)=>{if(c.g)c.g.gain.value=j===i?1:0;if(c.type==='video'&&j!==i)c.el.pause()});
  const c=clips[i];if(c.type==='video'){if(!exp)c.el.muted=!c.keep;c.el.currentTime=c.start;c.el.play().catch(()=>{})}}
function frameAt(e){let a=0;for(let i=0;i<clips.length;i++){const c=clips[i];
  if(e<a+c.dur||i===clips.length-1){if(i!==curIdx)enter(i);drawClip(c,Math.min(e-a,c.dur),i);return}a+=c.dur}}
function musicPlay(){if(!mAud)return;mAud.currentTime=+$('mStart').value;mAud.volume=$('mVol').value/100;mAud.play().catch(()=>{})}
function play(){if(playing||!clips.length)return;playing=true;curIdx=-1;const tot=total();T0=performance.now();musicPlay();
  const loop=()=>{if(!playing)return;let e=(performance.now()-T0)/1000;if(e>=tot){T0=performance.now();e=0;curIdx=-1;musicPlay()}
    frameAt(e);$('tm').textContent=fmt(e)+' / '+fmt(tot);raf=requestAnimationFrame(loop)};loop()}
function stop(){playing=false;cancelAnimationFrame(raf);curIdx=-1;clips.forEach(c=>{if(c.type==='video'&&c.el)c.el.pause()});if(mAud)mAud.pause();$('tm').textContent='';redraw()}

// ---------- 音樂 ----------
function setMusicRange(){if(!mAud||!isFinite(mAud.duration))return;const m=Math.max(0,mAud.duration-total()),r=$('mStart');r.max=m;if(+r.value>m)r.value=m;$('vMs').textContent=fmt(+r.value);
  $('mInfo').textContent=`${mFile.name}（全長 ${fmt(mAud.duration)}）`+(mAud.duration<total()?'，音樂比影片短，後面會沒聲音':'')}
$('mFile').onchange=e=>{const f=e.target.files[0];if(!f)return;mFile=f;mBuf=null;if(mAud)mAud.pause();mAud=new Audio();mAud.preload='metadata';mAud.onloadedmetadata=setMusicRange;mAud.src=URL.createObjectURL(f);e.target.value=''};
$('mStart').oninput=e=>{$('vMs').textContent=fmt(+e.target.value)};
$('mVol').oninput=e=>{$('vMv').textContent=e.target.value+'%';if(mAud)mAud.volume=e.target.value/100};

// ---------- 輸出 ----------
function showSave(bl,name){const u=URL.createObjectURL(bl);let o=$('saveBox');
  if(!o){o=document.createElement('div');o.id='saveBox';o.style.cssText='position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px';document.body.appendChild(o)}
  o.innerHTML=`<p style="color:#fbbf24;font-size:14px">影片做好了！按「分享 / 存到檔案」，再選「儲存影片」</p><video src="${u}" controls playsinline style="max-height:68vh;max-width:100%;border-radius:8px"></video><button id="sShare" style="padding:8px 24px;border-radius:999px;background:#262626;color:#eee;border:1px solid #404040">分享 / 存到檔案</button><button id="sClose" style="padding:8px 24px;border-radius:999px;background:#f59e0b;color:#111;font-weight:600">關閉</button>`;
  o.style.display='flex';$('sShare').onclick=()=>{const f=new File([bl],name,{type:bl.type});if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});else alert('此瀏覽器不支援分享，請改用電腦下載。')};
  $('sClose').onclick=()=>{o.style.display='none'}}
function saveBlob(bl,ext){const name=`Video_${Date.now()}.${ext}`;
  if(matchMedia('(pointer:coarse)').matches){showSave(bl,name);return}
  const u=URL.createObjectURL(bl),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}
async function makeVideo(){
  const st=$('stat'),btn=$('bMake');
  if(!clips.length){st.textContent='請先加入片段。';return}
  stop();
  if(!window.MediaRecorder||!cv.captureStream){st.textContent='此瀏覽器不支援錄製影片，請改用較新的 Chrome 或 Safari。';return}
  const mime=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));
  if(!mime){st.textContent='此瀏覽器不支援影片格式。';return}
  const fps=24,tot=total();btn.disabled=true;exp=true;
  const tracks=cv.captureStream(fps).getVideoTracks();let ac=null,dest=null,msrc=null,mg=null;
  if(mFile||clips.some(c=>c.type==='video'&&c.keep)){
    try{ac=new (window.AudioContext||window.webkitAudioContext)();await ac.resume();dest=ac.createMediaStreamDestination();
      clips.forEach(c=>{c.g=null;if(c.type==='video'&&c.keep&&c.el){c.el.muted=false;const s=ac.createMediaElementSource(c.el);c.g=ac.createGain();c.g.gain.value=0;s.connect(c.g);c.g.connect(dest)}});
      if(mFile){if(!mBuf)mBuf=await ac.decodeAudioData(await mFile.arrayBuffer());msrc=ac.createBufferSource();msrc.buffer=mBuf;mg=ac.createGain();msrc.connect(mg);mg.connect(dest)}
      tracks.push(...dest.stream.getAudioTracks())}
    catch(e){st.textContent='聲音處理失敗，將產生沒有聲音的影片。';ac=null;msrc=null}}
  const rec=new MediaRecorder(new MediaStream(tracks),{mimeType:mime,videoBitsPerSecond:Math.round(W*H*fps*.09),audioBitsPerSecond:96000}),ch=[];
  rec.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};const done=new Promise(r=>rec.onstop=r);
  curIdx=-1;rec.start(500);
  if(msrc){const n=ac.currentTime,v=$('mVol').value/100,off=Math.min(+$('mStart').value,Math.max(0,mBuf.duration-.1)),ln=Math.min(tot,mBuf.duration-off);
    mg.gain.setValueAtTime(0,n);mg.gain.linearRampToValueAtTime(v,n+.5);mg.gain.setValueAtTime(v,n+Math.max(.5,ln-.8));mg.gain.linearRampToValueAtTime(0,n+ln);msrc.start(n,off,ln)}
  T0=performance.now();
  await new Promise(res=>{const loop=()=>{const e=(performance.now()-T0)/1000;if(e>=tot){res();return}frameAt(e);st.textContent=`錄製中 ${Math.round(e)} / ${Math.round(tot)} 秒…`;requestAnimationFrame(loop)};loop()});
  rec.stop();await done;
  clips.forEach(c=>{if(c.type==='video'&&c.el)c.el.pause()});if(ac)ac.close();
  clips.forEach(c=>{if(c.g){c.el=newVid(c.url);c.g=null}});
  exp=false;curIdx=-1;btn.disabled=false;
  const bl=new Blob(ch,{type:mime.split(';')[0]});
  st.textContent=`完成：${(bl.size/1024/1024).toFixed(1)} MB`+(mime.includes('webm')?'（此瀏覽器只能產生 WebM，部分手機的 LINE 可能無法播放，建議改用 Safari 或較新的 Chrome）':'');
  redraw();saveBlob(bl,mime.includes('webm')?'webm':'mp4')}

// ---------- 事件 ----------
$('fVid').onchange=e=>{addFiles('video',[...e.target.files]);e.target.value=''};
$('fImg').onchange=e=>{addFiles('image',[...e.target.files]);e.target.value=''};
$('bPlay').onclick=play;$('bStop').onclick=stop;$('bMake').onclick=makeVideo;
document.querySelectorAll('.asp').forEach(b=>b.onclick=()=>{asp=b.dataset.a;document.querySelectorAll('.asp').forEach(x=>x.classList.toggle('on',x===b));stop();setSize()});
$('qSel').onchange=e=>{Q=+e.target.value;stop();setSize()};
setSize();renderList();
</script>
</body>
