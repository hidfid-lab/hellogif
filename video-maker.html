<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多段影片串接 ‧ 文字特效影片產生器</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
body{background:#121212;color:#e8e6e1;font-family:'Noto Sans TC',sans-serif}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#444;border-radius:3px}
canvas{touch-action:none}
.card{background:#171717;border:1px solid #262626;border-radius:16px;padding:14px}
.h{font-size:12px;color:#fbbf24;letter-spacing:.12em;font-weight:600;margin-bottom:8px}
.chip{padding:8px 12px;border-radius:10px;background:#262626;border:1px solid #404040;font-size:13px;color:#d4d4d4}
.chip.on{border-color:#f59e0b;color:#fbbf24}
select,textarea,input[type=number]{width:100%;padding:8px;background:#262626;border:1px solid #404040;border-radius:10px;color:#eee;font-size:13px}
input[type=range]{width:100%;accent-color:#f59e0b}
label.l{display:flex;justify-content:space-between;font-size:11px;color:#a3a3a3;margin-bottom:4px}
.clipi{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;border-radius:12px;background:#262626;border:1px solid #404040;font-size:13px;cursor:pointer}
.clipi.on{border-color:#f59e0b}.clipi button{padding:2px 8px;background:#404040;border-radius:8px}
.sub{border-top:1px solid #262626;padding-top:12px}
</style>
</head>
<body>
<div class="h-screen flex flex-col lg:flex-row">

<section class="shrink-0 lg:w-1/2 h-[46vh] lg:h-full flex flex-col items-center p-3 lg:p-5 bg-neutral-950 border-b lg:border-b-0 lg:border-r border-neutral-800">
  <div class="flex-1 min-h-0 w-full flex items-center justify-center">
    <canvas id="cv" class="rounded-xl border border-neutral-800 shadow-2xl cursor-move" style="max-width:100%;max-height:100%"></canvas>
  </div>
  <div class="w-full max-w-[560px] mt-2 flex flex-wrap items-center justify-center gap-2">
    <button id="bPlay" class="chip">▶ 預覽全部</button>
    <button id="bStop" class="chip">■ 停止</button>
    <button id="bSnap" class="chip">📷 存目前畫面</button>
    <button data-a="9:16" class="asp chip on">9:16 直式</button>
    <button data-a="16:9" class="asp chip">16:9 橫式</button>
    <select id="qSel" style="width:auto"><option value="540" selected>畫質：標準</option><option value="720">畫質：高</option></select>
    <span id="tm" class="text-xs text-neutral-400"></span>
  </div>
  <button id="bMake" class="mt-2 w-full max-w-[560px] py-2.5 rounded-full bg-amber-500 text-neutral-950 font-bold">🎬 生成影片</button>
  <p id="stat" class="text-xs text-neutral-400 mt-1 text-center">可以直接在預覽畫面上按住文字拖曳。生成需要和影片一樣長的時間。</p>
</section>

<section class="flex-1 min-h-0 overflow-y-auto p-3 lg:p-5 space-y-3">
  <div class="card">
    <p class="text-sm text-amber-200 bg-amber-500/10 rounded-lg p-2 mb-3">① 加入影片或照片　② 點選片段設定　③ 在畫面上拖曳文字　④ 預覽　⑤ 生成影片</p>
    <div class="flex items-center justify-between mb-2"><div class="h !mb-0">片段清單（<span id="totalT">0</span> 秒）</div>
      <div class="flex gap-2">
        <label class="chip cursor-pointer">＋影片<input type="file" id="fVid" accept="video/*" multiple class="hidden"></label>
        <label class="chip cursor-pointer">＋照片<input type="file" id="fImg" accept="image/*" multiple class="hidden"></label>
      </div></div>
    <div id="list" class="space-y-2"></div>
  </div>

  <div id="editor" class="card space-y-3 hidden">
    <div class="flex items-center justify-between"><div class="h !mb-0">片段設定</div><button id="bDup" class="chip">複製此片段</button></div>
    <div id="vidBox" class="space-y-3">
      <div><label class="l"><span>影片從第幾秒開始</span><span id="vStart"></span></label><input type="range" id="eStart" min="0" max="10" step="0.5"></div>
      <div><label class="l"><span>播放速度</span><span id="vSpeed"></span></label><input type="range" id="eSpeed" min="0.25" max="4" step="0.05">
        <div class="flex flex-wrap gap-2 mt-2"><button class="chip spd" data-s="0.5">0.5×</button><button class="chip spd" data-s="1">1×</button><button class="chip spd" data-s="1.5">1.5×</button><button class="chip spd" data-s="2">2×</button><button id="bAutoSpd" class="chip">📏 依長度自動算速度</button></div></div>
      <div class="grid grid-cols-2 gap-3 items-end">
        <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="eKeep" class="accent-amber-500"> 保留影片原聲</label>
        <div><label class="l"><span>原聲音量</span><span id="vVol"></span></label><input type="range" id="eVol" min="0" max="100"></div>
      </div>
    </div>
    <div><label class="l"><span>這一段的長度</span><span id="vDur"></span></label><input type="range" id="eDur" min="0.5" max="30" step="0.1"></div>
    <div class="grid grid-cols-2 gap-3">
      <div><label class="l"><span>畫面填滿方式</span></label><select id="eFit"><option value="cover">填滿（裁切）</option><option value="contain">完整顯示（模糊背景）</option></select></div>
      <div><label class="l"><span>色調濾鏡</span></label><select id="eFilter"><option value="none">原色</option><option value="warm">暖調</option><option value="cool">冷調</option><option value="bw">黑白</option><option value="retro">復古</option><option value="vivid">鮮豔</option></select></div>
      <div><label class="l"><span>進場轉場</span></label><select id="eTr"><option value="fade">淡入（黑）</option><option value="white">白閃</option><option value="slide">從右滑入</option><option value="zoom">縮放進入</option><option value="none">無</option></select></div>
      <div><label class="l"><span>背景變暗</span><span id="vDim"></span></label><input type="range" id="eDim" min="0" max="70"></div>
    </div>
    <div><label class="l"><span>畫面特效</span></label><select id="eFx">
      <option value="none">無</option><option value="snow">❄️ 雪花飄落</option><option value="petal">🌸 花瓣飄落</option><option value="dust">✨ 金色光點上升</option><option value="star">⭐ 星光閃爍</option>
      <option value="tornado">🌪️ 龍捲風來襲</option><option value="tsunami">🌊 海嘯淹沒</option><option value="meteor">☄️ 隕石雨轟炸</option><option value="lightning">⚡ 雷雨閃電</option><option value="fire">🔥 熊熊大火</option><option value="ufo">🛸 UFO 綁架牛</option></select></div>
    <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="eQuake" class="accent-amber-500"> 🫨 地震搖晃</label>
  </div>

  <div id="textCard" class="card space-y-3 hidden">
    <div class="h">文字方塊（可以加很多個）</div>
    <div id="tChips" class="flex flex-wrap gap-2"></div>
    <div class="flex flex-wrap gap-2"><button id="bAddT" class="chip !border-amber-500 !text-amber-300">＋新增文字方塊</button><button id="bStk" class="chip">＋貼圖</button></div>
    <div id="stkRow" class="hidden flex flex-wrap gap-1 text-2xl"></div>
    <div id="tEdit" class="space-y-3 sub hidden">
      <p class="text-xs text-amber-200">在預覽畫面上按住這個文字，就能拖到想要的位置。</p>
      <textarea id="eText" rows="2"></textarea>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="l"><span>字體</span></label><select id="eFont"><option value="'Noto Serif TC', serif">宋體 / 明體</option><option value="'Noto Sans TC', sans-serif">黑體</option><option value="'Cinzel', serif">Cinzel</option></select></div>
        <div><label class="l"><span>文字顏色</span></label><input type="color" id="eColor" class="w-full h-9 bg-transparent"></div>
        <div><label class="l"><span>字級</span><span id="vSize"></span></label><input type="range" id="eSize" min="16" max="160"></div>
        <div><label class="l"><span>文字動畫</span></label><select id="eTa"><option value="fade">淡入</option><option value="rise">上浮淡入</option><option value="pop">彈出放大</option><option value="type">逐字打出</option><option value="none">無</option></select></div>
        <div><label class="l"><span>出現時間</span><span id="vIn"></span></label><input type="range" id="eIn" min="0" max="10" step="0.1"></div>
        <div><label class="l"><span>消失時間</span><span id="vOut"></span></label><input type="range" id="eOut" min="0.5" max="10" step="0.1"></div>
      </div>
      <div class="flex flex-wrap gap-4 text-sm">
        <label class="flex items-center gap-2"><input type="checkbox" id="eStroke" class="accent-amber-500"> 黑色描邊</label>
        <label class="flex items-center gap-2"><input type="checkbox" id="eBg" class="accent-amber-500"> 半透明底色</label>
      </div>
      <div class="flex gap-2"><button id="bCenter" class="chip">置中</button><button id="bDelT" class="chip !text-red-300">刪除這個文字方塊</button></div>
    </div>
  </div>

  <div class="card space-y-3">
    <div class="h">🎵 背景音樂（選填，整支影片共用）</div>
    <label class="chip block text-center cursor-pointer">選擇音樂檔<input type="file" id="mFile" accept="audio/*" class="hidden"></label>
    <p id="mInfo" class="text-xs text-neutral-400">尚未選擇音樂</p>
    <div><label class="l"><span>從音樂的第幾秒開始</span><span id="vMs">0:00</span></label><input type="range" id="mStart" min="0" max="0" step="0.5" value="0"></div>
    <div><label class="l"><span>音樂音量</span><span id="vMv">70%</span></label><input type="range" id="mVol" min="10" max="100" value="70"></div>
    <div class="sub space-y-2">
      <button id="bFitM" class="chip w-full">🎯 讓全部片段剛好填滿這段音樂（自動調整長度與影片速度）</button>
      <div class="flex gap-2 items-center"><input type="number" id="bpm" min="40" max="220" placeholder="音樂 BPM（例如 120）" style="flex:1"><button id="bBeat" class="chip whitespace-nowrap">🥁 長度對齊節拍</button></div>
    </div>
  </div>
  <p class="text-xs text-neutral-500 px-1 pb-6">提醒：生成是即時錄製，片子多長就要等多久。建議整支控制在 1 分鐘內。iPhone 拍的 HEVC 影片在部分瀏覽器可能無法讀取。</p>
</section>
</div>

<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),T2=2*Math.PI,CF='filter' in ctx;
let W=540,H=960,asp='9:16',Q=540,clips=[],sel=-1,selT=-1,playing=false,raf=0,T0=0,curIdx=-1,exp=false,uid=0,mFile=null,mBuf=null,mAud=null,drag=null;
const PT=(()=>{let q=7;const r=()=>(q=(q*16807)%2147483647)/2147483647;return Array.from({length:70},()=>({x:r(),y:r(),r:r(),c:1+Math.floor(r()*2),ph:r()*6.28}))})();
const fmt=x=>Math.floor(x/60)+':'+String(Math.floor(x%60)).padStart(2,'0');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const total=()=>clips.reduce((a,c)=>a+c.dur,0);
const r1=x=>Math.round(x*10)/10;
const maxDur=c=>c.type==='video'?Math.max(.5,Math.min(30,(c.vdur-c.start)/c.speed)):30;
const SANS="'Noto Sans TC', sans-serif",SERIF="'Noto Serif TC', serif";
const newText=(txt,o)=>Object.assign({text:txt,font:SERIF,color:'#ffffff',size:56,x:50,y:50,ta:'fade',stroke:false,bg:false,tIn:0,tOut:99},o||{});
const cur=()=>clips[sel],curT=()=>{const c=cur();return c&&c.texts[selT]};

function setSize(){W=asp==='9:16'?Q:Math.round(Q*16/9);H=asp==='9:16'?Math.round(Q*16/9):Q;cv.width=W;cv.height=H;redraw()}

// ---------- 素材載入 ----------
function newVid(url){const v=document.createElement('video');v.muted=true;v.playsInline=true;v.setAttribute('playsinline','');v.preload='auto';v.src=url;return v}
function loadMedia(c){return new Promise(res=>{
  if(c.type==='image'){const im=new Image();im.onload=()=>{c.el=im;res(true)};im.onerror=()=>res(false);im.src=c.url}
  else{const v=newVid(c.url);v.onloadedmetadata=()=>{c.vdur=v.duration||0;c.el=v;res(c.vdur>0)};v.onerror=()=>res(false)}})}
async function addFiles(type,files){
  for(const f of files){
    const c={id:++uid,type,url:URL.createObjectURL(f),name:f.name,el:null,vdur:0,start:0,dur:3,speed:1,keep:true,vol:100,fit:'cover',filter:'none',tr:'fade',dim:20,fx:'none',quake:false,texts:[newText('在這裡輸入文字')]};
    $('stat').textContent='讀取中：'+f.name;
    if(!(await loadMedia(c))){alert('無法讀取：'+f.name+'（格式可能不支援）');continue}
    if(type==='video')c.dur=Math.max(.5,r1(Math.min(c.vdur,5)));
    clips.push(c);sel=clips.length-1}
  $('stat').textContent='';selT=cur()&&cur().texts.length?0:-1;refreshAll()}
function refreshAll(){renderList();syncEditor();renderTexts();syncText();setMusicRange();redraw()}

// ---------- 清單 ----------
function renderList(){
  $('list').innerHTML=clips.length?clips.map((c,i)=>`<div class="clipi ${i===sel?'on':''}" onclick="pick(${i})"><span class="truncate">${i+1}. ${c.type==='video'?'🎬':'🖼️'} ${esc(c.name)} ‧ ${r1(c.dur)}秒${c.type==='video'&&c.speed!==1?' ‧ '+c.speed+'×':''}</span><span class="flex gap-1 shrink-0"><button onclick="event.stopPropagation();mv(${i},-1)">↑</button><button onclick="event.stopPropagation();mv(${i},1)">↓</button><button onclick="event.stopPropagation();del(${i})">✕</button></span></div>`).join(''):'<p class="text-xs text-neutral-500">還沒有片段，請按右上角「＋影片」或「＋照片」。</p>';
  $('editor').classList.toggle('hidden',sel<0);$('textCard').classList.toggle('hidden',sel<0);$('totalT').textContent=r1(total())}
function pick(i){stop();sel=i;selT=cur().texts.length?0:-1;refreshAll()}
function mv(i,d){const j=i+d;if(j<0||j>=clips.length)return;[clips[i],clips[j]]=[clips[j],clips[i]];sel=j;renderList();redraw()}
function del(i){stop();clips.splice(i,1);sel=Math.min(sel,clips.length-1);selT=cur()&&cur().texts.length?0:-1;refreshAll()}
$('bDup').onclick=()=>{const c=cur();if(!c)return;stop();const d=JSON.parse(JSON.stringify(Object.assign({},c,{el:null,g:null})));d.id=++uid;d.name=c.name;
  d.el=c.type==='video'?newVid(c.url):c.el;clips.splice(sel+1,0,d);sel++;selT=d.texts.length?0:-1;refreshAll()};

// ---------- 片段設定 ----------
function labels(c){$('vDur').textContent=r1(c.dur)+' 秒';$('vStart').textContent=c.start+' 秒';$('vSpeed').textContent=c.speed+'×';$('vVol').textContent=c.vol+'%';$('vDim').textContent=c.dim+'%'}
function syncEditor(){const c=cur();if(!c)return;
  $('vidBox').classList.toggle('hidden',c.type!=='video');
  if(c.type==='video'){$('eStart').max=Math.max(0,c.vdur-.5);$('eStart').value=c.start;$('eSpeed').value=c.speed;$('eKeep').checked=c.keep;$('eVol').value=c.vol}
  $('eDur').max=maxDur(c);$('eDur').value=c.dur;$('eFit').value=c.fit;$('eFilter').value=c.filter;$('eTr').value=c.tr;$('eDim').value=c.dim;$('eFx').value=c.fx;$('eQuake').checked=c.quake;labels(c)}
function bindC(id,prop,conv,after){$(id).addEventListener('input',e=>{const c=cur();if(!c)return;
  c[prop]=conv(e.target.type==='checkbox'?e.target.checked:e.target.value);if(after)after(c);labels(c);renderList();setMusicRange();syncText();redraw()})}
const num=v=>+v,idf=v=>v;
const clampDur=c=>{c.dur=Math.min(c.dur,maxDur(c));$('eDur').max=maxDur(c);$('eDur').value=c.dur};
bindC('eDur','dur',num);
bindC('eStart','start',num,clampDur);bindC('eSpeed','speed',num,clampDur);
bindC('eKeep','keep',idf);bindC('eVol','vol',num);bindC('eFit','fit',idf);bindC('eFilter','filter',idf);bindC('eTr','tr',idf);bindC('eDim','dim',num);bindC('eFx','fx',idf);bindC('eQuake','quake',idf);
document.querySelectorAll('.spd').forEach(b=>b.onclick=()=>{const c=cur();if(!c)return;c.speed=+b.dataset.s;clampDur(c);syncEditor();renderList();redraw()});
$('bAutoSpd').onclick=()=>{const c=cur();if(!c||c.type!=='video')return;
  c.speed=Math.round(Math.min(4,Math.max(.25,(c.vdur-c.start)/c.dur))*20)/20;clampDur(c);syncEditor();renderList();redraw()};

// ---------- 文字方塊 ----------
function renderTexts(){const c=cur();if(!c)return;
  $('tChips').innerHTML=c.texts.map((t,i)=>`<button class="chip ${i===selT?'on':''}" onclick="pickT(${i})">${esc((t.text.replace(/\n/g,' ')||'(空)').slice(0,8))}</button>`).join('')||'<span class="text-xs text-neutral-500">這個片段沒有文字方塊</span>';
  $('tEdit').classList.toggle('hidden',selT<0)}
function pickT(i){selT=i;renderTexts();syncText();redraw()}
function syncText(){const c=cur(),t=curT();if(!c||!t)return;
  $('eText').value=t.text;$('eFont').value=t.font;$('eColor').value=t.color;$('eSize').value=t.size;$('eTa').value=t.ta;$('eStroke').checked=t.stroke;$('eBg').checked=t.bg;
  $('eIn').max=c.dur;$('eOut').max=c.dur;$('eIn').value=Math.min(t.tIn,c.dur);$('eOut').value=Math.min(t.tOut,c.dur);
  $('vSize').textContent=t.size;$('vIn').textContent=r1(t.tIn)+' 秒';$('vOut').textContent=t.tOut>=c.dur?'到結尾':r1(t.tOut)+' 秒'}
function bindT(id,prop,conv,after){$(id).addEventListener('input',e=>{const t=curT();if(!t)return;
  t[prop]=conv(e.target.type==='checkbox'?e.target.checked:e.target.value);if(after)after(t);syncText();if(prop==='text')renderTexts();redraw()})}
bindT('eText','text',idf);bindT('eFont','font',idf);bindT('eColor','color',idf);bindT('eSize','size',num);bindT('eTa','ta',idf);bindT('eStroke','stroke',idf);bindT('eBg','bg',idf);
bindT('eIn','tIn',num);bindT('eOut','tOut',num,t=>{if(t.tOut>=cur().dur-.05)t.tOut=99});
function addText(txt,o){const c=cur();if(!c)return;c.texts.push(newText(txt,Object.assign({y:Math.min(88,30+c.texts.length*14)},o)));selT=c.texts.length-1;renderTexts();syncText();redraw()}
$('bAddT').onclick=()=>addText('新文字');
const STK=['❤️','🎉','🎂','🌸','🙏','👍','😂','🌞','🌈','⭐','🎁','🏮','🧧','☕','🐶','🌹'];
$('stkRow').innerHTML=STK.map(e=>`<button type="button" data-e="${e}">${e}</button>`).join('');
$('bStk').onclick=()=>$('stkRow').classList.toggle('hidden');
$('stkRow').onclick=e=>{const b=e.target.closest('button');if(b)addText(b.dataset.e,{size:110,font:SANS,ta:'pop',y:50})};
$('bCenter').onclick=()=>{const t=curT();if(t){t.x=50;t.y=50;redraw()}};
$('bDelT').onclick=()=>{const c=cur();if(!c||selT<0)return;c.texts.splice(selT,1);selT=c.texts.length?Math.min(selT,c.texts.length-1):-1;renderTexts();syncText();redraw()};

// ---------- 畫布拖曳 ----------
function cpos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function dDown(e){if(playing||exp)return false;const c=cur();if(!c)return false;const p=cpos(e);
  for(let i=c.texts.length-1;i>=0;i--){const t=c.texts[i],b=t._b;
    if(b&&p.x>=b.x-14&&p.x<=b.x+b.w+14&&p.y>=b.y-14&&p.y<=b.y+b.h+14){selT=i;drag={i,dx:p.x-W*t.x/100,dy:p.y-H*t.y/100};renderTexts();syncText();redraw();return true}}
  return false}
function dMove(e){if(!drag)return;const t=cur().texts[drag.i],p=cpos(e);
  t.x=Math.max(0,Math.min(100,(p.x-drag.dx)/W*100));t.y=Math.max(0,Math.min(100,(p.y-drag.dy)/H*100));redraw()}
const dUp=()=>{drag=null};

  const tracks=cv.captureStream(fps).getVideoTracks();let ac=null,dest=null,msrc=null,mg=null;
  if(mFile||clips.some(c=>c.type==='video'&&c.keep)){
    try{ac=new (window.AudioContext||window.webkitAudioContext)();await ac.resume();dest=ac.createMediaStreamDestination();
      clips.forEach(c=>{c.g=null;if(c.type==='video'&&c.keep&&c.el){c.el.muted=false;c.el.volume=1;const s=ac.createMediaElementSource(c.el);c.g=ac.createGain();c.g.gain.value=0;s.connect(c.g);c.g.connect(dest)}});
      if(mFile){if(!mBuf)mBuf=await ac.decodeAudioData(await mFile.arrayBuffer());msrc=ac.createBufferSource();msrc.buffer=mBuf;mg=ac.createGain();msrc.connect(mg);mg.connect(dest)}
      tracks.push(...dest.stream.getAudioTracks())}
    catch(e){st.textContent='聲音處理失敗，將產生沒有聲音的影片。';ac=null;msrc=null}}
  const rec=new MediaRecorder(new MediaStream(tracks),{mimeType:mime,videoBitsPerSecond:Math.round(W*H*fps*.09),audioBitsPerSecond:96000}),ch=[];
  rec.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};const done=new Promise(r=>rec.onstop=r);
  curIdx=-1;rec.start(500);
  if(msrc){const n=ac.currentTime,v=$('mVol').value/100,off=Math.min(+$('mStart').value,Math.max(0,mBuf.duration-.1)),ln=Math.min(tot,mBuf.duration-off);
    mg.gain.setValueAtTime(0,n);mg.gain.linearRampToValueAtTime(v,n+.5);mg.gain.setValueAtTime(v,n+Math.max(.5,ln-.8));mg.gain.linearRampToValueAtTime(0,n+ln);msrc.start(n,off,ln)}
  T0=performance.now();
  await new Promise(res=>{const loop=()=>{const e=(performance.now()-T0)/1000;if(e>=tot){res();return}frameAt(e);st.textContent=`錄製中 ${Math.round(e)} / ${Math.round(tot)} 秒…`;requestAnimationFrame(loop)};loop()});
  rec.stop();await done;
  clips.forEach(c=>{if(c.type==='video'&&c.el)c.el.pause()});if(ac)ac.close();
  clips.forEach(c=>{if(c.g){c.el=newVid(c.url);c.g=null}});
  exp=false;curIdx=-1;btn.disabled=false;
  const bl=new Blob(ch,{type:mime.split(';')[0]});
  st.textContent=`完成：${(bl.size/1024/1024).toFixed(1)} MB`+(mime.includes('webm')?'（此瀏覽器只能產生 WebM，部分手機的 LINE 可能無法播放，建議改用 Safari 或較新的 Chrome）':'');
  redraw();saveBlob(bl,mime.includes('webm')?'webm':'mp4')}

// ---------- 事件 ----------
$('fVid').onchange=e=>{addFiles('video',[...e.target.files]);e.target.value=''};
$('fImg').onchange=e=>{addFiles('image',[...e.target.files]);e.target.value=''};
$('bPlay').onclick=play;$('bStop').onclick=stop;$('bMake').onclick=makeVideo;
document.querySelectorAll('.asp').forEach(b=>b.onclick=()=>{asp=b.dataset.a;document.querySelectorAll('.asp').forEach(x=>x.classList.toggle('on',x===b));stop();setSize()});
$('qSel').onchange=e=>{Q=+e.target.value;stop();setSize()};
setSize();renderList();
</script>
